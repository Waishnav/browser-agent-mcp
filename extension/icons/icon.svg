<!-- Simple icon for Browser Agent MCP -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="#007bff"/>
  
  <!-- Browser window -->
  <rect x="28" y="32" width="72" height="52" rx="4" fill="white"/>
  
  <!-- Browser toolbar -->
  <rect x="28" y="32" width="72" height="12" rx="4" fill="#e0e0e0"/>
  
  <!-- Browser dots -->
  <circle cx="36" cy="38" r="2" fill="#ff5f57"/>
  <circle cx="44" cy="38" r="2" fill="#ffbd2e"/>
  <circle cx="52" cy="38" r="2" fill="#28c840"/>
  
  <!-- Cursor/Agent icon -->
  <path d="M 45 50 L 55 75 L 60 70 L 70 80 L 75 75 L 65 65 L 70 60 Z" 
        fill="#007bff" stroke="white" stroke-width="2"/>
  
  <!-- AI indicator -->
  <circle cx="90" cy="50" r="8" fill="#28a745"/>
  <text x="90" y="55" font-family="Arial" font-size="10" font-weight="bold" 
        fill="white" text-anchor="middle">AI</text>
</svg>
