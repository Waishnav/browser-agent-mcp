<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Browser Agent MCP</title>
  <style>
    body {
      width: 320px;
      padding: 16px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      color: #1f2937;
    }
    
    h1 {
      margin: 0 0 16px 0;
      font-size: 18px;
      font-weight: 600;
      color: #111827;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .status {
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    
    .status.connected {
      background: #d1fae5;
      color: #065f46;
      border: 1px solid #6ee7b7;
    }
    
    .status.disconnected {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fca5a5;
    }
    
    .status.partial {
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fcd34d;
    }
    
    .status-icon {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 8px;
    }
    
    .status-icon.green {
      background: #10b981;
    }
    
    .status-icon.red {
      background: #ef4444;
    }
    
    .status-icon.yellow {
      background: #f59e0b;
    }
    
    button {
      width: 100%;
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    
    .btn-primary:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(102, 126, 234, 0.3);
    }
    
    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
      margin-top: 8px;
    }
    
    .btn-secondary:hover:not(:disabled) {
      background: #e5e7eb;
    }
    
    .info {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #e5e7eb;
      font-size: 12px;
      color: #6b7280;
    }
    
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    
    .info-label {
      font-weight: 500;
    }
    
    .info-value {
      font-family: monospace;
      font-size: 11px;
    }
    
    .tab-list {
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
    }
    
    .tab-item {
      padding: 8px;
      border-radius: 4px;
      margin-bottom: 4px;
      background: #f9fafb;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    .tab-item.active {
      background: #dbeafe;
      border: 1px solid #93c5fd;
    }
    
    .tab-item.connected {
      border-left: 3px solid #10b981;
    }
    
    .tab-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #6b7280;
    }
  </style>
</head>
<body>
  <h1>🤖 Browser Agent MCP</h1>
  
  <div id="status" class="status disconnected">
    <span class="status-icon red"></span>
    <span id="status-text">Not Connected</span>
  </div>
  
  <button id="connect-btn" class="btn-primary">Connect This Tab</button>
  <button id="disconnect-btn" class="btn-secondary" style="display: none;">Disconnect Tab</button>
  
  <div class="info">
    <div class="info-row">
      <span class="info-label">MCP Server:</span>
      <span id="server-status" class="info-value">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">WebSocket:</span>
      <span id="ws-status" class="info-value">—</span>
    </div>
    <div class="info-row">
      <span class="info-label">Tab ID:</span>
      <span id="tab-id" class="info-value">—</span>
    </div>
  </div>
  
  <div id="tab-list" class="tab-list" style="display: none;">
    <h3 style="font-size: 13px; margin: 16px 0 8px 0; color: #6b7280;">All Tabs</h3>
    <div id="tabs-container"></div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
